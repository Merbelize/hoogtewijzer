services:
  - type: web
    name: hoogtewijzer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_ACCESS_CODE
        sync: false
